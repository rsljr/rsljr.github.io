- title: Selected Publications
  type: time_table
  contents:
    - title: "Digital Activism: Beyond Collective Action and Hashtags"
      institution: Academy of Management Perspectives
      year: 2024
      url: https://doi.org/10.5465/amp.2023.0064
      description:
        - Critiques current theories of digital activism and argues that 'connective action' allows loose coalitions to exert significant pressure on firms without centralized organization.

    - title: "Of Shepherds and Sheep: Who Sets the Agenda for Firms' Attention to Social Issues?"
      institution: Corporate Social Responsibility and Environmental Management
      year: 2025
      url: https://doi.org/10.1002/csr.2979
      description:
        - Investigates how traditional media acts as a 'curator,' setting the agenda for which social issues firms address in their CSR reports.

    - title: "Firms' Response to Slacktivism: When and Why are E‐Petitions Effective?"
      institution: Journal of Management Studies
      year: 2024
      url: https://doi.org/10.1111/joms.13010
      description:
        - Finds that the 'velocity' of signatures and media coverage significantly increases the likelihood of a firm response to digital activism.

    - title: "Threat, mortality, and rigidity: how terror management and threat rigidity shaped small business responses to the COVID-19 crisis"
      institution: Journal of Small Business & Entrepreneurship
      year: 2026
      url: https://doi.org/10.1080/08276331.2026.2614237
      description:
        - "Integrates Terror Management Theory and Threat Rigidity to examine small business responses to the COVID-19 crisis. We find that the pandemic shock led to a significant increase in directive leadership behavior, consistent with threat-rigidity mechanisms."

